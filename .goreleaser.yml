version: 2

before:
  hooks:
    - go mod download

builds:
  - id: simtool
    main: ./cmd/simtool
    binary: simtool
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=13.0
    hooks:
      post:
        - bash scripts/verify-macos-target.sh "{{ .Path }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

universal_binaries:
  - id: simtool
    replace: true

archives:
  - id: simtool
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'

signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - 'sign-blob'
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive
    documents:
      - '${artifact}.cdx.json'
    cmd: syft
    args:
      - '$artifact'
      - '--output'
      - 'cyclonedx-json=$document'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: azizuysal
    name: simtool
  
  header: |
    ## SimTool {{ .Tag }}
    
    Terminal UI for iOS Simulator management with powerful app browsing and file viewing capabilities.
    
  footer: |
    ## Installation
    
    ### Homebrew
    ```bash
    brew install azizuysal/tap/simtool
    ```
    
    ### Direct Download
    Download the appropriate archive for your system from the assets below and extract it.
    
    ### From Source
    ```bash
    go install github.com/azizuysal/simtool/cmd/simtool@{{ .Tag }}
    ```
    
    ---
    **Full Changelog**: https://github.com/azizuysal/simtool/compare/{{ .PreviousTag }}...{{ .Tag }}
